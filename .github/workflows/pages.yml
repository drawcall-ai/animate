# Builds every example and the index listing them, and deploys them to GitHub Pages on each push to main.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the weights the vitecache plugin rigs each character with ahead, which take a minute a model to compute
      - uses: actions/cache@v4
        with:
          path: examples/*/public/_vitecache
          key: rigs-${{ hashFiles('pnpm-lock.yaml', 'examples/*/skeleton.ts', 'examples/*/public/models/**') }}
          restore-keys: rigs-
      - run: pnpm pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
