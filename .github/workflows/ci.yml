name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # one platform, the one the package is published from: long seeded stories amplify last-bit differences in platform maths into
    # different outcomes for the marginal checks, so the suite's expected results hold per platform
    runs-on: ubuntu-latest
    env:
      LIFE_SEED_OFFSET: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
