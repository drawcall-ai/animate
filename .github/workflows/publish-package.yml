name: Publish Package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LIFE_SEED_OFFSET: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          fi
          pnpm --dir packages/animate exec npm pkg set version="$version"
      - run: pnpm check
      # npm trusted publisher: drawcall-ai/animate, publish-package.yml, no environment.
      # Confirm the repository before enabling publishing: this checkout has no Git remote.
      - name: Publish @drawcall/animate
        working-directory: packages/animate
        run: pnpm exec npm publish --access public --provenance --tag latest
