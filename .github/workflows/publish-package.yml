name: Publish Package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          fi
          pnpm --dir packages/animate exec npm pkg set version="$version"
      # (`source` is how this workspace runs the package from its sources; a tarball has none, so an installer must not resolve it)
      - name: Drop the workspace's source exports
        run: pnpm --dir packages/animate exec npm pkg delete 'exports[.].source' 'exports[./species].source' 'exports[./puppet].source'
      # npm trusted publisher: drawcall-ai/animate, publish-package.yml, no environment.
      - name: Publish @drawcall/animate
        working-directory: packages/animate
        run: pnpm exec npm publish --access public --provenance --tag latest
