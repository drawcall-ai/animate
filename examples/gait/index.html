    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Gait drills</title>
    <style>
      html, body { margin: 0; height: 100%; background: #202020; color: #ddd; font: 13px monospace; overflow: hidden }
      canvas { display: block; width: 100%; height: 100% }
      pre, #keys { position: absolute; margin: 0; padding: 6px 8px; background: #0008 }
      #keys { right: env(safe-area-inset-right); top: env(safe-area-inset-top); display: flex; flex-direction: column; gap: 4px }
      #keys button { font: inherit; text-align: left }
      #readout { left: env(safe-area-inset-left); bottom: env(safe-area-inset-bottom) }
    </style>
  </head>

    <canvas id="stage"></canvas>
    <div id="keys"></div>
    <pre id="readout"></pre>
