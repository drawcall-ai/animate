<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shooter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #202020;
        color: #e0e0e0;
        font:
          13px/1.5 ui-monospace,
          monospace;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      pre {
        position: fixed;
        margin: 0;
        padding: 10px 12px;
        background: rgb(0 0 0 / 50%);
        pointer-events: none;
      }
      #keys {
        top: 0;
        left: 0;
      }
      #readout {
        bottom: 0;
        left: 0;
        max-width: 100%;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <pre id="keys">
click      take the mouse: it aims (or the arrow keys)
WASD       move, Shift sprints, C crouches
mouse L/K  fire        mouse R/F  aim down the sights
R reload   Space/J jump   G grenade
E press the button on the wall   H get hit</pre>
    <pre id="readout"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
