<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grip</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14171c;
        color: #dfe4ea;
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: 440px;
      }
      #ui button,
      #ui select {
        background: #252b34;
        color: inherit;
        border: 1px solid #3a424e;
        border-radius: 6px;
        padding: 6px 10px;
        margin: 0 4px 4px 0;
        cursor: pointer;
        font: inherit;
      }
      #ui button.on {
        background: #2f6fde;
        border-color: #2f6fde;
        color: #fff;
      }
      #hint {
        margin: 6px 0;
        color: #aab3bf;
      }
      #hud {
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        color: #9fe0b0;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="buttons"></div>
      <div id="hint"></div>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
