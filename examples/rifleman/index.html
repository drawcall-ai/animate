<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rifleman</title>
  </head>
  <body>
    <h1>Rifleman</h1>
    <p>
      WASD lead him relative to where he aims, Q and E turn his aim left and right, Shift sprints (forward only). R
      reloads the rifle, G throws a grenade toward the aim.
    </p>
    <canvas id="stage"></canvas>
    <div class="bar">
      <button id="again" type="button">Again</button>
      <label
        >Speed
        <select id="speed">
          <option value="1" selected>1×</option>
          <option value="0.5">½×</option>
          <option value="0.25">¼×</option>
          <option value="0.1">⅒×</option>
        </select>
      </label>
    </div>
    <pre id="readout"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
