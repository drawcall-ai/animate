<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Led</title>
  </head>
  <body>
    <h1>Led</h1>
    <p>
      Arrow keys or WASD lead him: right and left along z, up and down along x, away from the view and toward it. Shift
      runs. F keeps him facing as he does.
    </p>
    <canvas id="stage"></canvas>
    <div class="bar">
      <button id="again" type="button">Again</button>
      <label
        >Speed
        <select id="speed">
          <option value="1" selected>1×</option>
          <option value="0.5">½×</option>
          <option value="0.25">¼×</option>
          <option value="0.1">⅒×</option>
        </select>
      </label>
    </div>
    <pre id="readout"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
